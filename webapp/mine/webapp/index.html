<style>
  :root{
    --bg:#ffffff;
    --ink:#0e0e0e;
    --ink-2:#5f5f5f;
    --ink-3:#9a9a9a;
    --line:#e6e6e6;
    --fill:#f4f4f4;
    --fill-2:#ebebeb;
    --hover:#f7f7f7;
    --shadow:0 1px 2px rgba(0,0,0,.04);
    --serif:"Iowan Old Style","Palatino Linotype","Songti SC","Noto Serif SC",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC",sans-serif;
  }
  [data-theme="dark"]{
    --bg:#0d0d0d;
    --ink:#f2f2f2;
    --ink-2:#a0a0a0;
    --ink-3:#6b6b6b;
    --line:#242424;
    --fill:#1b1b1b;
    --fill-2:#232323;
    --hover:#171717;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.7 var(--sans);
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    transition:background .2s, color .2s;
  }
  .app{height:100dvh; display:flex; flex-direction:column; max-width:780px; margin:0 auto; padding:0 36px}

  /* ---------- header ---------- */
  header{
    flex:0 0 auto; height:66px; display:flex; align-items:center; gap:11px;
    border-bottom:1px solid var(--line);
  }
  .avatar{
    width:36px;height:36px;border-radius:50%;object-fit:cover;flex:0 0 auto;
    border:1px solid var(--line); background:var(--fill);
  }
  .brand{font-size:13.5px;font-weight:500;letter-spacing:.07em}
  .sub{margin-left:2px;font-size:11.5px;color:var(--ink-3);letter-spacing:.03em}
  .sp{flex:1}
  .status{width:7px;height:7px;border-radius:50%;background:#cfcfcf;margin-right:8px;transition:background .3s}
  .status.on{background:#22c55e}
  .status.off{background:#ef4444}
  .ibtn{
    width:32px;height:32px;display:grid;place-items:center;
    border:0;background:none;border-radius:9px;cursor:pointer;
    color:var(--ink-3); transition:.15s;
  }
  .ibtn:hover{color:var(--ink); background:var(--fill)}
  .ibtn.active{color:var(--ink); background:var(--fill)}
  .ibtn svg{width:17px;height:17px}

  /* ---------- thread ---------- */
  main{flex:1 1 auto; overflow-y:auto; padding:40px 0 24px; position:relative}
  main::-webkit-scrollbar{width:8px}
  main::-webkit-scrollbar-thumb{background:var(--fill-2);border-radius:99px}
  main::-webkit-scrollbar-track{background:transparent}

  /* messages */
  .msg{margin:0 0 30px; animation:fade .2s ease both}
  @keyframes fade{from{opacity:0; transform:translateY(3px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important; transition:none!important}
  }

  .msg.ai .body{
    margin:0; font-size:16px; line-height:1.8;
    white-space:pre-wrap; word-break:break-word; max-width:640px;
  }
  .msg.me{display:flex; flex-direction:column; align-items:flex-end}
  .msg.me .body{
    margin:0; max-width:74%; padding:12px 16px; border-radius:12px;
    background:var(--fill); font-size:15.5px; line-height:1.65;
    white-space:pre-wrap; word-break:break-word;
  }
  .meta{
    display:flex; align-items:center; gap:10px;
    margin-top:7px; font-size:11.5px; color:var(--ink-3);
    opacity:0; transition:opacity .18s;
  }
  .msg:hover .meta, .msg:focus-within .meta{opacity:1}
  .meta button{
    border:0;background:none;padding:0;cursor:pointer;
    font:inherit;font-size:11.5px;color:var(--ink-3);transition:color .15s;
  }
  .meta button:hover{color:var(--ink)}
  .caret::after{
    content:""; display:inline-block; width:2px; height:1.05em;
    background:var(--ink); margin-left:3px; vertical-align:-2px;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* scroll to bottom */
  .totop{
    position:absolute; right:6px; bottom:16px;
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line); background:var(--bg); color:var(--ink-2);
    display:none; place-items:center; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.07); transition:.15s;
  }
  .totop.on{display:grid}
  .totop:hover{color:var(--ink); border-color:var(--ink-3)}
  .totop svg{width:15px;height:15px}

  /* ---------- composer ---------- */
  footer{flex:0 0 auto; padding:14px 0 max(24px,env(safe-area-inset-bottom))}
  .box{
    display:flex; align-items:flex-end; gap:10px;
    border:1px solid var(--line); border-radius:16px;
    background:var(--bg); padding:11px 11px 11px 16px;
    transition:border-color .18s, box-shadow .18s;
  }
  .box:focus-within{border-color:var(--ink-3); box-shadow:0 2px 14px rgba(0,0,0,.055)}
  textarea{
    flex:1; border:0; outline:0; resize:none; background:none; padding:5px 0;
    font:inherit; font-size:16px; line-height:1.6; color:var(--ink);
    max-height:140px;
  }
  textarea::placeholder{color:var(--ink-3)}
  .send{
    flex:0 0 auto; width:38px;height:34px;border:0;border-radius:10px;cursor:pointer;
    background:var(--ink); color:var(--bg);
    display:grid;place-items:center; transition:.16s;
  }
  .send:hover{opacity:.82}
  .send:active{transform:scale(.95)}
  .send.is-disabled{opacity:.25; cursor:default; transform:none}
  .send svg{width:17px;height:17px}
  .send.stop{background:var(--ink)}
  .hint{
    margin-top:9px; display:flex; justify-content:space-between;
    font-size:11px; color:var(--ink-3);
  }

  @media (max-width:560px){
    .app{padding:0 20px}
    header{height:58px}
    main{padding-top:26px}
    .msg{margin-bottom:24px}
    .msg.me .body{max-width:82%; font-size:15px}
    .msg.ai .body{font-size:15.5px}
    footer{padding-top:10px}
    .meta{opacity:1}
  }
  :focus-visible{outline:2px solid var(--ink); outline-offset:3px; border-radius:3px}
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const thread = $('thread'), input = $('input');
const sendBtn = $('send'), clearBtn = $('clear'), themeBtn = $('theme');
const totop = $('totop'), count = $('count');
const iconMoon = $('icon-moon'), iconSun = $('icon-sun');
const iconSend = $('icon-send'), iconStop = $('icon-stop');
const ttsBtn = $('tts'), exportBtn = $('export'), statusEl = $('status');

let messages = [];      // {role, content, ts}
let busy = false;
let controller = null;

/* ---------- theme ---------- */
const savedTheme = localStorage.getItem('atri-theme') || 'light';
document.documentElement.dataset.theme = savedTheme;
function syncThemeIcons(){
  const dark = document.documentElement.dataset.theme === 'dark';
  iconMoon.style.display = dark ? 'none' : 'block';
  iconSun.style.display  = dark ? 'block' : 'none';
}
syncThemeIcons();
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('atri-theme', next);
  syncThemeIcons();
});

/* ---------- helpers ---------- */
const nowTime = () => new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
const scrollDown = () => { thread.scrollTop = thread.scrollHeight; };
const atBottom = () => thread.scrollHeight - thread.scrollTop - thread.clientHeight < 120;

function grow(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  count.textContent = input.value.length ? input.value.length + ' 字' : '';
  if (!busy) sendBtn.classList.toggle('is-disabled', !input.value.trim());
}

function addMsg(role, text, ts){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'me' : 'ai');

  const body = document.createElement('p');
  body.className = 'body';
  body.textContent = text;
  wrap.appendChild(body);

  const meta = document.createElement('div');
  meta.className = 'meta';
  const time = document.createElement('span');
  time.textContent = ts || nowTime();
  meta.appendChild(time);

  if (role === 'assistant'){
    const copyBtn = document.createElement('button');
    copyBtn.textContent = '复制';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(body.textContent).then(() => {
        copyBtn.textContent = '已复制';
        setTimeout(() => copyBtn.textContent = '复制', 1200);
      });
    };
    meta.appendChild(copyBtn);

    const speakBtn = document.createElement('button');
    speakBtn.textContent = '朗读';
    speakBtn.onclick = () => speak(body.textContent);
    meta.appendChild(speakBtn);

    const regenBtn = document.createElement('button');
    regenBtn.textContent = '重新生成';
    regenBtn.onclick = regenerate;
    meta.appendChild(regenBtn);
  }

  wrap.appendChild(meta);
  thread.appendChild(wrap);
  scrollDown();
  return { wrap, body };
}

/* ---------- send ---------- */
async function send(text){
  const msg = (text ?? input.value).trim();
  if (busy || !msg) return;

  busy = true;
  input.value = ''; grow();
  messages.push({ role:'user', content:msg, ts:nowTime() });
  addMsg('user', msg, messages[messages.length-1].ts);

  const { wrap, body } = addMsg('assistant', '');
  body.classList.add('caret');
  const aiMsg = { role:'assistant', content:'', ts:nowTime() };
  messages.push(aiMsg);

  controller = new AbortController();
  setBusyUI(true);

  let acc = '';
  try{
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ messages: messages.filter(m => m.role !== 'assistant' || m.content) }),
      signal: controller.signal
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true){
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts){
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        try{
          const o = JSON.parse(data);
          if (o.text){ acc += o.text; body.textContent = acc; if (atBottom()) scrollDown(); }
        }catch(e){}
      }
    }
  }catch(err){
    if (err.name === 'AbortError'){
      if (!acc) body.textContent = '（已停止）';
    } else {
      body.textContent = '连接中断了：' + err.message;
    }
  }finally{
    body.classList.remove('caret');
    if (acc) { aiMsg.content = acc; if (autoRead) speak(acc); }
    else {
      messages.pop();              // 没输出就丢掉这条空 AI 消息
      if (body.textContent === '') wrap.remove();
    }
    controller = null;
    busy = false;
    setBusyUI(false);
    input.focus();
  }
}

function setBusyUI(on){
  sendBtn.classList.toggle('stop', on);
  iconSend.style.display = on ? 'none' : 'block';
  iconStop.style.display = on ? 'block' : 'none';
  sendBtn.setAttribute('aria-label', on ? '停止生成' : '发送');
  sendBtn.classList.toggle('is-disabled', on ? false : !input.value.trim());
}

/* ---------- regenerate ---------- */
async function regenerate(){
  if (busy) return;

  let aiIdx = -1;
  for (let i = messages.length - 1; i >= 0; i--){
    if (messages[i].role === 'assistant' && messages[i].content){ aiIdx = i; break; }
  }
  if (aiIdx === -1) return;

  let userIdx = -1;
  for (let i = aiIdx - 1; i >= 0; i--){
    if (messages[i].role === 'user'){ userIdx = i; break; }
  }
  if (userIdx === -1) return;
  const userText = messages[userIdx].content;

  const aiEls = thread.querySelectorAll('.msg.ai');
  const meEls = thread.querySelectorAll('.msg.me');
  if (aiEls.length) aiEls[aiEls.length - 1].remove();
  if (meEls.length) meEls[meEls.length - 1].remove();

  messages.splice(userIdx, 2);
  busy = false;
  await send(userText);
}

/* ---------- stop ---------- */
function stop(){
  if (controller) controller.abort();
}
sendBtn.addEventListener('click', () => {
  if (busy){ stop(); return; }
  send();   // send() 内部会检查输入是否为空
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); busy ? null : send(); }
});
input.addEventListener('input', grow);

/* ---------- clear ---------- */
clearBtn.addEventListener('click', clearChat);

/* ---------- scroll button ---------- */
thread.addEventListener('scroll', () => {
  totop.classList.toggle('on', !atBottom() && thread.scrollHeight > 200);
});
totop.addEventListener('click', scrollDown);

/* ---------- ATRI speaks first ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));

// 开场白：全部取自游戏解包剧本（liuyuze61/ATRI-miband, role=亚托莉），逐字核对
const OPENERS = {
  morning: [
    '早上好呜…………呼啊啊～～～～',
    '我这就去做早饭哦……吧唧……',
    '来吧！',
  ],
  day: [
    '欢迎回来！',
    '怎么了吗？',
    '来吃便当吧',
    '小事一桩，我是高性能的嘛',
    '哼哼，我才是高性能的呢',
    '螃蟹很好吃的。好吃就是高兴！',
    '想吃什么？啊，我来给你做汉堡肉吃怎么样',
    '怎么样～，还是我比较高性能吧？',
  ],
  night: [
    '嗯哼哼～，睡吧♪ 就像平常一样安眠吧',
    '哼哼哼，今天的晚饭就交给我了',
    '哎呀呀。没事吧？',
  ],
};

function pickOpener(){
  const h = new Date().getHours();
  let pool;
  if (h >= 5 && h < 11) pool = OPENERS.morning;
  else if (h >= 22 || h < 5) pool = OPENERS.night;
  else pool = OPENERS.day;
  return pool[Math.floor(Math.random() * pool.length)];
}

let openerToken = 0;

async function sayOpener(){
  const token = ++openerToken;
  await sleep(420);
  if (token !== openerToken || busy || messages.length) return;

  const wrap = document.createElement('div');
  wrap.className = 'msg ai opener';
  const body = document.createElement('p');
  body.className = 'body caret';
  wrap.appendChild(body);
  thread.appendChild(wrap);

  const text = pickOpener();
  for (let i = 1; i <= text.length; i++){
    if (token !== openerToken) { wrap.remove(); return; }
    body.textContent = text.slice(0, i);
    await sleep(58);
  }
  body.classList.remove('caret');
}

/* 用户一开始输入，就把还没打完的开场白撤掉 */
input.addEventListener('input', () => {
  if (input.value) openerToken++;
});

/* ================= TTS ================= */
const synth = window.speechSynthesis;
let voices = [];
const loadVoices = () => { voices = synth ? synth.getVoices() : []; };
if (synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }

let autoRead = localStorage.getItem('atri-tts') === '1';
const syncTtsBtn = () => ttsBtn.classList.toggle('active', autoRead);
syncTtsBtn();

function speak(text){
  if (!synth || !text.trim()) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = 1.02;
  u.pitch = 1.12;
  const zh = voices.filter(v => /zh|cmn/i.test(v.lang));
  const pick = zh.find(v => /Ting|Meijia|婷婷|美佳|Xiaoxiao|Xiaoyi|Yu-shu/i.test(v.name)) || zh[0];
  if (pick) u.voice = pick;
  synth.speak(u);
}

ttsBtn.addEventListener('click', () => {
  autoRead = !autoRead;
  localStorage.setItem('atri-tts', autoRead ? '1' : '0');
  syncTtsBtn();
  if (!autoRead && synth) synth.cancel();
});

/* ================= 连接状态 ================= */
async function ping(){
  try{
    const r = await fetch('/api/health', { cache:'no-store', signal: AbortSignal.timeout(4000) });
    statusEl.className = 'status ' + (r.ok ? 'on' : 'off');
  }catch(e){
    statusEl.className = 'status off';
  }
}
ping();
setInterval(ping, 8000);

/* ================= 导出 ================= */
exportBtn.addEventListener('click', () => {
  const items = messages.filter(m => m.content);
  if (!items.length) return;
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const stamp = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const body = items.map(m =>
    `**${m.role === 'user' ? '你' : 'ATRI'}** ${m.ts || ''}\n\n${m.content}\n`
  ).join('\n---\n\n');
  const text = `# ATRI 对话\n\n${stamp}\n\n---\n\n${body}`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:'text/markdown;charset=utf-8' }));
  a.download = `atri-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
});

/* ================= 清空 / 编辑上一条 ================= */
function clearChat(){
  if (busy) stop();
  messages = [];
  thread.querySelectorAll('.msg').forEach(el => el.remove());
  thread.scrollTop = 0;
  sayOpener();
  input.focus();
}

function editLast(){
  if (busy) return;
  let idx = messages.length - 1;
  while (idx >= 0 && messages[idx].role !== 'user') idx--;
  if (idx < 0) return;
  const text = messages[idx].content;

  const els = Array.from(thread.querySelectorAll('.msg'));
  let domIdx = -1;
  for (let k = els.length - 1; k >= 0; k--){
    if (els[k].classList.contains('me')){ domIdx = k; break; }
  }
  if (domIdx >= 0) els.slice(domIdx).forEach(el => el.remove());

  messages.splice(idx);
  input.value = text;
  grow();
  input.focus();
}

/* ================= 快捷键 ================= */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && busy){ e.preventDefault(); stop(); }
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); clearChat(); }
  else if (e.key === 'ArrowUp' && !input.value.trim() && !busy){ e.preventDefault(); editLast(); }
});

window.addEventListener('load', () => { grow(); input.focus(); sayOpener(); });
</script>
