### SFT QLoRA — Qwen3-8B（在 ~8GB 上勉强训 8B 时用；优先仍建议 4B LoRA）
### model
model_name_or_path: Qwen/Qwen3-8B
trust_remote_code: true
quantization_bit: 4
quantization_method: bitsandbytes
### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: all
### dataset
dataset_dir: data
dataset: atri_synth_sft
template: qwen3_nothink
cutoff_len: 1536
overwrite_cache: true
preprocessing_num_workers: 4
val_size: 0.03
### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
### eval / save
eval_strategy: steps
eval_steps: 100
save_steps: 200
logging_steps: 10
output_dir: runs/atri-companion-qwen3-8b-qlora-v0.1
plot_loss: true
