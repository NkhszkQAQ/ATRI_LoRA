### C-think: v1.0-C 的数据(atri_multiturn_v10_r 917 条) + 内心独白，从 v5-deep 续训
### 与原 C 版唯一差别：数据带 <think> 块、template 改成 qwen3（开思考）
model_name_or_path: /root/autodl-tmp/models/Qwen3-4B-ms
adapter_name_or_path: /root/autodl-tmp/atri-runs/sft-v5-deep
trust_remote_code: true
### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: q_proj,v_proj
quantization_bit: 4
quantization_type: nf4
double_quantization: true
### dataset
dataset_dir: /root/autodl-tmp/atri/data_r
dataset: atri_multiturn_v10_r_think
template: qwen3
enable_thinking: true
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16
val_size: 0.05
### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 2.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
logging_steps: 5
save_steps: 100
save_total_limit: 2
output_dir: /root/autodl-tmp/atri-runs/sft-v10-multiturn-think
overwrite_output_dir: true
