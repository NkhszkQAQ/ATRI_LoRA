### C-8B-think: Qwen3-8B 底座 + C 的数据(atri_multiturn_v10_r_think 875 条) + 内心独白
### 4B 版被用户判定「思考内容太浅，不是调教问题而是底座不够」，改 8B 从基座训
model_name_or_path: /root/autodl-tmp/models/Qwen3-8B
trust_remote_code: true
### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: q_proj,v_proj
quantization_bit: 4
quantization_type: nf4
double_quantization: true
### dataset
dataset_dir: /root/autodl-tmp/atri/data_r
dataset: atri_multiturn_v10_r_think
template: qwen3
enable_thinking: true
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16
val_size: 0.05
### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.5e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
logging_steps: 5
save_steps: 100
save_total_limit: 2
output_dir: /root/autodl-tmp/atri-runs/sft8b-v10-think
overwrite_output_dir: true
