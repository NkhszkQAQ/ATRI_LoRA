### v6-A：单轮对照组（v4_clean）——与 v6-B 用完全相同的超参，只差数据有没有上下文
### 用途：4070 8G / T4 16G 上跑完，和 v6-B 比称呼、抗议、省略号、句长
model_name_or_path: /root/autodl-tmp/models/Qwen3-4B-ms
trust_remote_code: true
### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: q_proj,v_proj
quantization_bit: 4
quantization_type: nf4
double_quantization: true
### dataset
dataset_dir: /root/autodl-tmp/atri/data
dataset: atri_v4_clean
template: qwen3_nothink
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 8
val_size: 0.08
### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
optim: adamw_torch
dataloader_num_workers: 8
seed: 42
### eval / save
eval_strategy: steps
eval_steps: 25
save_strategy: steps
save_steps: 25
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
logging_steps: 5
output_dir: /root/autodl-tmp/atri-runs/sft-v6-single
plot_loss: true
save_total_limit: 3
overwrite_output_dir: false
report_to: none
