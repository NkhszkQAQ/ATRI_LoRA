### SFT LoRA — Qwen3-4B（~8GB：RTX 5060 等）
### model
model_name_or_path: Qwen/Qwen3-4B
trust_remote_code: true
### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: all
### dataset
dataset_dir: data
dataset: atri_synth_sft
template: qwen3_nothink
cutoff_len: 1536
overwrite_cache: true
preprocessing_num_workers: 2
val_size: 0.03
### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
### eval / save
eval_strategy: steps
eval_steps: 50
save_steps: 100
logging_steps: 5
output_dir: runs/atri-companion-qwen3-4b-sft-v0.1
plot_loss: true
save_total_limit: 2
