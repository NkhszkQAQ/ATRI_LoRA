### v7：情境数据，从 v5 续训（保风格 + 学语气随环境变）
### 数据：atri_situational_v7（991 条，带完整场景+关系阶段标注，只留夏生/陌生人↔亚托莉）
### 低 lr + 1 epoch：轻量续训，不洗掉 v5 的说话风格
model_name_or_path: /root/autodl-tmp/models/Qwen3-4B-ms
adapter_name_or_path: /root/autodl-tmp/atri-runs/sft-v5-deep
trust_remote_code: true
### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: q_proj,v_proj
quantization_bit: 4
quantization_type: nf4
double_quantization: true
### dataset
dataset_dir: /root/autodl-tmp/atri/data
dataset: atri_situational_v7
template: qwen3_nothink
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 8
val_size: 0.08
### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
optim: adamw_torch
dataloader_num_workers: 8
seed: 42
### eval / save
eval_strategy: steps
eval_steps: 20
save_strategy: steps
save_steps: 20
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
logging_steps: 5
output_dir: /root/autodl-tmp/atri-runs/sft-v7-situational
plot_loss: true
save_total_limit: 3
overwrite_output_dir: false
report_to: none
