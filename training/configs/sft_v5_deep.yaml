### v5：从 v4 续训 4 epoch（累计6），让原作句式吃得更透
model_name_or_path: /root/autodl-tmp/models/Qwen3-4B-ms
adapter_name_or_path: /root/autodl-tmp/atri-runs/sft-v4-base
trust_remote_code: true
### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: q_proj,v_proj
quantization_bit: 4
quantization_type: nf4
double_quantization: true
### dataset
dataset_dir: /root/autodl-tmp/atri/data
dataset: atri_v4_clean
template: qwen3_nothink
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 22
val_size: 0.08
### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 4.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
optim: adamw_torch
dataloader_num_workers: 16
seed: 42
### eval / save
eval_strategy: steps
eval_steps: 25
save_strategy: steps
save_steps: 25
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
logging_steps: 5
output_dir: /root/autodl-tmp/atri-runs/sft-v5-deep
plot_loss: true
save_total_limit: 3
overwrite_output_dir: false
report_to: none
