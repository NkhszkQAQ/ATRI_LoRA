### v3: 基于清洗后数据 atri_v3_clean，从 v2.2 adapter 续训
### 相对 v2.2 的改动：lr 4e-5 -> 2e-5（纠偏不猛改）、epoch 6 -> 3（防过拟合）、eval/save 20 -> 10
model_name_or_path: /root/autodl-tmp/models/Qwen3-4B-ms
adapter_name_or_path: /root/autodl-tmp/atri-runs/sft-v3-continue
trust_remote_code: true
### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: q_proj,v_proj
quantization_bit: 4
quantization_type: nf4
double_quantization: true
### dataset
dataset_dir: /root/autodl-tmp/atri/data
dataset: atri_v31_clean
template: qwen3_nothink
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 22
val_size: 0.08
### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 1.5e-5
num_train_epochs: 4.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
optim: adamw_torch
dataloader_num_workers: 16
seed: 42
### eval / save
eval_strategy: steps
eval_steps: 10
save_strategy: steps
save_steps: 10
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
logging_steps: 2
output_dir: /root/autodl-tmp/atri-runs/sft-v31-continue
plot_loss: true
save_total_limit: 3
overwrite_output_dir: false
report_to: none
