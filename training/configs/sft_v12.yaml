### v12: 多轮为主体(69%) + 固定反应加权 + 哼哼降频，从 v5 续训
model_name_or_path: /root/autodl-tmp/models/Qwen3-4B-ms
adapter_name_or_path: /root/autodl-tmp/atri-runs/sft-v5-deep
trust_remote_code: true
### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: q_proj,v_proj
quantization_bit: 4
quantization_type: nf4
double_quantization: true
### dataset
dataset_dir: /root/autodl-tmp/atri/data
dataset: atri_v12_clean
template: qwen3_nothink
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16
val_size: 0.05
### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 2.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
logging_steps: 5
save_steps: 100
save_total_limit: 2
output_dir: /root/autodl-tmp/atri-runs/sft-v12-mixed
overwrite_output_dir: true
