### R-8B-think v2: 从 8B 角色底座(sft8b-base)续训 R 的思考数据
model_name_or_path: /root/autodl-tmp/models/Qwen3-8B
adapter_name_or_path: /root/autodl-tmp/atri-runs/sft8b-base-x5
trust_remote_code: true
### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: q_proj,v_proj
quantization_bit: 4
quantization_type: nf4
double_quantization: true
### dataset
dataset_dir: /root/autodl-tmp/atri/data_r
dataset: atri_v13_clean_r_think
template: qwen3
enable_thinking: true
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16
val_size: 0.02
### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
logging_steps: 5
save_steps: 100
save_total_limit: 2
output_dir: /root/autodl-tmp/atri-runs/sft8b-v13-think-v3
overwrite_output_dir: true
