### SFT QLoRA V2 试训 — Qwen3-4B（8GB 本机稳训版：降截断/LoRA，关中途 eval）
### model
model_name_or_path: Qwen/Qwen3-4B
trust_remote_code: true
quantization_bit: 4
quantization_method: bitsandbytes
### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: q_proj,v_proj
### dataset
dataset_dir: data
dataset: atri_v2_pilot
template: qwen3_nothink
cutoff_len: 512
overwrite_cache: true
preprocessing_num_workers: 1
val_size: 0.0
### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
optim: adamw_torch
ddp_timeout: 180000000
### eval / save
eval_strategy: "no"
save_steps: 20
logging_steps: 1
output_dir: runs/atri-companion-qwen3-4b-sft-v2-pilot
plot_loss: true
save_total_limit: 3
overwrite_output_dir: false
